#==============================================================================
# Listening Ports (APACHE_HTTP_PORT and APACHE_HTTPS_PORT, default 80 and 443)
#==============================================================================
Listen ${APACHE_HTTP_PORT}

# HTTPS listener only when the entrypoint enabled SSL (see sites-available/vhost.conf)
<IfDefine SSL_ENABLED>
    Listen ${APACHE_HTTPS_PORT}
</IfDefine>
