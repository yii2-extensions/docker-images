#==============================================================================
# Health Endpoints
#
# The health script lives in the image, outside the application, and runs
# through PHP-FPM (see the .php handler in 05-php-fpm.conf). Application
# .htaccess files and front-controller rewrites do not apply to it.
#==============================================================================

<Directory /usr/local/lib/yii2-docker/health>
    Options None
    AllowOverride None
    Require all granted

    # Keep health requests out of the access log (see 06-logging.conf)
    SetEnv no_log 1
</Directory>

#------------------------------------------------------------------------------
# Internal endpoint for the container healthcheck: always on, loopback only,
# excluded from the HTTP to HTTPS redirect (see sites-available/vhost.conf)
#------------------------------------------------------------------------------
AliasMatch "^/__health$" /usr/local/lib/yii2-docker/health/health.php

<Location /__health>
    Require ip 127.0.0.1 ::1
</Location>

#------------------------------------------------------------------------------
# Public endpoint at HEALTHCHECK_PATH (ENABLE_HEALTH_ENDPOINT=true)
#------------------------------------------------------------------------------
<IfDefine HEALTH_ENDPOINT>
    AliasMatch "^${HEALTHCHECK_PATH}/?$" /usr/local/lib/yii2-docker/health/health.php
</IfDefine>
