#==============================================================================
# Apache Virtual Hosts for Yii2 with HTTP/2
#
# Static configuration driven by defines that the entrypoint passes through
# APACHE_ARGUMENTS (see /etc/apache2/envvars):
#   SSL_ENABLED         HTTPS virtual host on APACHE_HTTPS_PORT
#   SSL_REDIRECT        HTTP to HTTPS redirect (requires SSL_ENABLED)
#   SSL_DEFAULT_PORT    APACHE_HTTPS_PORT is 443, so redirect targets keep the historical port rules
#   SSL_CHAIN           SSLCertificateChainFile from SSL_CHAIN_FILE
#   SSL_STAPLING        OCSP stapling (see 03-ssl-tls.conf)
#==============================================================================

#------------------------------------------------------------------------------
# HTTP Virtual Host
#------------------------------------------------------------------------------
<VirtualHost *:${APACHE_HTTP_PORT}>
    # Enable HTTP/2 cleartext and HTTP/1.1
    Protocols h2c http/1.1

    # Include common configuration
    Include /etc/apache2/conf-available/vhost-common.conf

    <IfDefine SSL_ENABLED>
        <IfDefine SSL_REDIRECT>
            # Redirect to HTTPS, except the internal health endpoint used by the container healthcheck
            RewriteEngine On

            <IfDefine SSL_DEFAULT_PORT>
                # Redirect localhost to port 8443, others to standard HTTPS (port 443)
                RewriteCond %{REQUEST_URI} !^/__health$
                RewriteCond %{SERVER_NAME} =localhost
                RewriteRule ^ https://%{SERVER_NAME}:8443%{REQUEST_URI} [R=301,L,NE]
                RewriteCond %{REQUEST_URI} !^/__health$
                RewriteCond %{SERVER_NAME} !=localhost
                RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L,NE]
            </IfDefine>
            <IfDefine !SSL_DEFAULT_PORT>
                # Custom HTTPS port: every host is redirected to APACHE_HTTPS_PORT
                RewriteCond %{REQUEST_URI} !^/__health$
                RewriteRule ^ https://%{SERVER_NAME}:${APACHE_HTTPS_PORT}%{REQUEST_URI} [R=301,L,NE]
            </IfDefine>
        </IfDefine>
    </IfDefine>
</VirtualHost>

#------------------------------------------------------------------------------
# HTTPS Virtual Host
#------------------------------------------------------------------------------
<IfDefine SSL_ENABLED>
    <VirtualHost *:${APACHE_HTTPS_PORT}>
        # Enable HTTP/2 and HTTP/1.1 over SSL
        Protocols h2 http/1.1

        # Certificate paths come from the environment written by the entrypoint
        SSLEngine on
        SSLCertificateFile ${SSL_CERT_FILE}
        SSLCertificateKeyFile ${SSL_KEY_FILE}

        <IfDefine SSL_CHAIN>
            SSLCertificateChainFile ${SSL_CHAIN_FILE}
        </IfDefine>

        <IfDefine SSL_STAPLING>
            SSLUseStapling on
        </IfDefine>

        # HSTS (HTTP Strict Transport Security)
        <IfModule mod_headers.c>
            Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        </IfModule>

        # Include common configuration
        Include /etc/apache2/conf-available/vhost-common.conf
    </VirtualHost>
</IfDefine>
