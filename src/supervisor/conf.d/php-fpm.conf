#==============================================================================
# PHP-FPM Configuration
#==============================================================================

[program:php-fpm]
autorestart=unexpected
autostart=true
# disable_functions is set on the master instead of the pool: a pool-level value makes PHP-FPM 8.6.0RC2 workers crash
# with SIGSEGV when they exit; the workers inherit it, so web requests see the same list
command=/usr/local/sbin/php-fpm -F -d "disable_functions=%(ENV_PHP_DISABLE_FUNCTIONS)s"
exitcodes=0
killasgroup=true
priority=5
startretries=3
startsecs=5
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
stopsignal=QUIT
stopwaitsecs=10
