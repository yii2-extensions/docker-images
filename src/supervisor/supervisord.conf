#==============================================================================
# Supervisord Configuration
#==============================================================================

[unix_http_server]
chmod=0700
file=/run/yii2/supervisor/supervisor.sock

# Runs as the container user; programs inherit it. A root start passes --user root from the entrypoint, and only then
# can a program set user= (as the queue examples in conf.d/queue.conf do).
[supervisord]
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn
nodaemon=true
pidfile=/run/yii2/supervisor/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/yii2/supervisor/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
