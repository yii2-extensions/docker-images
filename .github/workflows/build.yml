---
on:
  pull_request:
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push:
    branches:
      - main
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

name: build

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    name: Bake
    # The `$/` self-repository syntax is not supported by actionlint 1.7.12, pinned by the org quality workflow.
    uses: ./.github/workflows/bake.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      packages: write # Registry build cache export on pushes to main; pull requests never log in.
    with:
      ref: ${{ github.sha }}
      cache-write: ${{ github.event_name == 'push' }}
      publish: false
