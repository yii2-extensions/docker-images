---
on:
  - pull_request
  - push

name: quality

permissions:
  contents: read

jobs:
  quality:
    uses: yii2-framework/actions/.github/workflows/quality.yml@a28eb7d4ab03abd53ccd7c79014b3b27d09932ff # v2.0.1
    permissions:
      contents: read
    with:
      codespell-config: .github/linters/.codespellrc
      editorconfig-checker-config: .github/linters/.editorconfig-checker.json
      markdownlint-config: .github/linters/.markdown-lint.yml
      yamllint-targets: .github

  hadolint:
    name: Hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    concurrency:
      cancel-in-progress: true
      group: hadolint-${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hadolint.
        run: bash .github/scripts/lint.sh hadolint

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    concurrency:
      cancel-in-progress: true
      group: shellcheck-${{ github.workflow }}-${{ github.ref }}

    steps:
      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck.
        run: bash .github/scripts/lint.sh shellcheck
