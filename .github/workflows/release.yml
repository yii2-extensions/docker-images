---
on:
  push:
    tags:
      - "v*.*.*"

  # Weekly rebuild of the latest release on fresh upstream images; only the rolling tags and `latest` move.
  schedule:
    - cron: "23 4 * * 1"

  workflow_dispatch:
    inputs:
      version:
        description: Release to rebuild (X.Y.Z, without `v`). Empty rebuilds the latest release, rolling tags only.
        default: ""
        required: false
        type: string

name: release

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      build: ${{ steps.resolve.outputs.build }}
      ref: ${{ steps.resolve.outputs.ref }}
      rolling: ${{ steps.resolve.outputs.rolling }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release to build.
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash .github/scripts/release-resolve.sh

  publish:
    name: Publish
    needs: resolve
    if: ${{ needs.resolve.outputs.build == 'true' }}
    # The `$/` self-repository syntax is not supported by actionlint 1.7.12, pinned by the org quality workflow.
    uses: ./.github/workflows/bake.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      packages: write # Push images to GitHub Container Registry.
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      version: ${{ needs.resolve.outputs.version }}
      publish: true
      rolling: ${{ needs.resolve.outputs.rolling == 'true' }}
      cache-write: false
