---
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Maintain pinned base images of the Apache flavor (the ARG-templated PHP base image is not trackable)
  - package-ecosystem: "docker"
    directory: "/src/flavor/apache"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
